# Default team composition for the engineering-team skill. Copy to ~/.config/swarm/team.toml
# (or point $SWARM_TEAM_CONFIG at it). A missing file means: product_manager on, build_engineer off.
#
# Always present, whatever this says (they cannot be removed): engineering_lead (EL), qa, engineer
# (one or more) and an independent judge.
#
# optional_roles lists the optional seats that are on by default:
#   product_manager  owns the user-facing requirements and the acceptance
#   build_engineer   owns build, CI and gating, rebased-result gating, scoped fix rounds, build-slot use
#   reviewer, verifier  the existing optional peer-review and checking roles
# Without product_manager, engineering_lead writes the change criteria and engineering_lead + qa
# record the product acceptance. Without build_engineer, engineering_lead owns its duties.
#
# One job can differ: `swarm activate --job J --team product_manager,build_engineer` or
# `swarm team --job J --add build_engineer` / `--remove product_manager` / `--show`.
optional_roles = ["product_manager"]

# The coding recipe matches DONE branch@<full SHA>. Other artifacts use the generic pipeline.
[pipeline]
integrate = true
target_branch = "main" # legacy merge_target is accepted as an alias
delete_branch = true

# Forge adapters: explicit choice, never inferred from a mirror/push URL.
[forge]
kind = "none" # github | gitea | gitlab | none
repository = "" # optional adapter-specific repository identifier
# Required for gitea/gitlab/none. Exit zero only for green project CI on this exact SHA.
# Supports shell-quoted {artifact}, {branch}, {sha}; {sha} is mandatory.
# Missing CI configuration holds integration. github alone has a built-in checker.
evidence_command = ""
# GitHub adapter: gh run list --commit SHA; gh pr create/view for PRs.
# Gitea adapter: tea/API for MRs/PRs and an exact-SHA CI command.
# GitLab adapter: glab/API for MRs and an exact-SHA CI command.
# none: configured project CI and direct push of the locally rebased branch.

# Optional overrides keyed by the owner's recorded absolute repository directory:
# [repositories."/home/me/src/my-repo"]
# target_branch = "main"
# [repositories."/home/me/src/my-repo".forge]
# kind = "gitea"
# repository = "me/my-repo"
# evidence_command = "project-ci --commit {sha}"
