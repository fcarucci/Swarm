name: Test
on:
  push:
    branches: ["dbg/e-win"]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        backend: [memory, sqlite, file]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-postgres.txt
      - name: focused tests
        env:
          SWARM_TEST_BACKEND: ${{ matrix.backend }}
          PYTHONUTF8: "1"
        run: |
          cd tests && python -B -m unittest -v test_runner_winjob test_drive_session_driver.IdleOrchestratorEndToEnd test_drive_session_driver.LifecycleTests 2>&1 | tail -400
