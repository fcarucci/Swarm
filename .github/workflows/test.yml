name: Test

on:
  push:
    branches-ignore:
      - "release/**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:
    inputs:
      ref:
        description: "Ref to test (default: the branch this was run from)"
        required: false
  workflow_call:
    inputs:
      ref:
        description: "Ref to test (default: the ref that triggered the caller)"
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel main, int/rc or tag runs; superseded runs on every other ref free their runners.
  cancel-in-progress: ${{ !(github.ref == 'refs/heads/main' || github.ref == 'refs/heads/int/rc' || startsWith(github.ref, 'refs/tags/v')) }}

# Two lanes, one set of check names (the main ruleset requires them by name, so every job always
# runs and reports; a job with nothing to do skips its steps and passes in seconds):
#  - release lane: pushes to main and int/rc, v* tags, workflow_dispatch / workflow_call (the
#    release workflow), and pull requests targeting main. The full matrix, every test module
#    including the slow ones, sharded across processes (.github/scripts/run_tests.py); macOS and
#    Windows run only here; the Postgres suite and the drive-on-Postgres suites in parallel jobs.
#  - fast lane: every other ref (feat/*, fix/*, ci/*, other int/*). One unit cell (memory, 3.13)
#    runs the test modules the change affects plus a smoke set, without the slow modules
#    (.github/scripts/test_tiers.json); the other cells, Postgres, macOS and Windows skip.
# A docs-only change (.github/scripts/code_changed.sh) skips everything, on either lane.
jobs:
  # Decides what runs. Fails open: if it cannot tell, everything runs.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
      lane: ${{ steps.diff.outputs.lane }}
      files: ${{ steps.diff.outputs.files }}
      complexity: ${{ steps.diff.outputs.complexity }}
      install: ${{ steps.diff.outputs.install }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0

      - name: What changed, and which lane?
        id: diff
        env:
          FULL: ${{ github.event_name == 'workflow_call' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/int/rc' || startsWith(github.ref, 'refs/tags/v'))) || (github.event_name == 'pull_request' && github.base_ref == 'main') }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          FORCED: ${{ github.event.forced }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          base= head=
          case "$EVENT" in
            pull_request)
              base=$(git merge-base "$PR_BASE" "$PR_HEAD") && head=$PR_HEAD || base= ;;
            push)
              if [[ "$REF" == refs/heads/* ]]; then
                head=$AFTER
                if [[ "$FORCED" != true && -n "$BEFORE" && ! "$BEFORE" =~ ^0+$ ]] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
                  base=$BEFORE
                else    # new branch or force push: what the branch changes against main
                  base=$(git merge-base origin/main "$AFTER" 2>/dev/null) || base=
                fi
              fi ;;
          esac
          code=true files=
          if [ -n "$base" ]; then
            code=$(.github/scripts/code_changed.sh "$base" "$head") || code=true
            files=$(git diff --name-only --no-renames "$base" "$head") || files=
          fi
          lane=fast complexity=true install=true
          if [ "$FULL" = true ]; then
            lane=full
          elif [ -n "$files" ]; then
            grep -q '^skills/complexity-analyzer/' <<< "$files" || complexity=false
            grep -qE '^(install\.sh|\.claude-plugin/|\.codex-plugin/)' <<< "$files" || install=false
          fi
          grep -q '^\.github/' <<< "$files" && complexity=true install=true
          { echo "code=$code"; echo "lane=$lane"; echo "complexity=$complexity"; echo "install=$install"
            echo "files<<EOF_FILES"; echo "$files"; echo "EOF_FILES"; } | tee -a "$GITHUB_OUTPUT"

  # Backend contract + hook/CLI suite, on every offline backend and both the minimum and the
  # latest supported Python (README "Requirements": 3.11 or newer). Fast lane: (memory, 3.13) only.
  unit:
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        backend: [memory, sqlite, file]
        python-version: ["3.11", "3.13"]
    env:
      RUN: ${{ needs.changes.outputs.code != 'false' && (needs.changes.outputs.lane != 'fast' || (matrix.backend == 'memory' && matrix.python-version == '3.13')) }}
      LANE: ${{ needs.changes.outputs.lane }}
      FILES: ${{ needs.changes.outputs.files }}
    steps:
      - uses: actions/checkout@v4
        if: env.RUN == 'true'
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-python@v5
        if: env.RUN == 'true'
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        if: env.RUN == 'true'
        run: pip install -r requirements.txt -r requirements-postgres.txt

      - name: Run tests (backend=${{ matrix.backend }})
        if: env.RUN == 'true'
        env:
          SWARM_TEST_BACKEND: ${{ matrix.backend }}
        run: |
          set -o pipefail
          args=()
          if [ "$LANE" = fast ]; then
            args=(--tier fast)
            if [ -n "$FILES" ]; then printf '%s\n' "$FILES" > "$RUNNER_TEMP/changed.txt"; args+=(--select "$RUNNER_TEMP/changed.txt"); fi
          fi
          python -B .github/scripts/run_tests.py "${args[@]}" </dev/null 2>&1 | tee test.log || { python .github/scripts/annotate.py test.log; exit 1; }

  # Native Windows: the unit suite on the offline backends. POSIX-only tests carry skip markers
  # with a reason; nothing is skipped on Linux.
  windows:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.lane != 'fast' }}
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        backend: [memory, sqlite, file]
    env:
      RUN: ${{ needs.changes.outputs.code != 'false' }}
    steps:
      - uses: actions/checkout@v4
        if: env.RUN == 'true'
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-python@v5
        if: env.RUN == 'true'
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        if: env.RUN == 'true'
        run: pip install -r requirements.txt -r requirements-postgres.txt

      - name: Run tests (backend=${{ matrix.backend }})
        if: env.RUN == 'true'
        env:
          SWARM_TEST_BACKEND: ${{ matrix.backend }}
          PYTHONUTF8: "1"
        run: |
          set -o pipefail
          python -B .github/scripts/run_tests.py </dev/null 2>&1 | tee test.log || { python .github/scripts/annotate.py test.log; exit 1; }

  # install.sh must keep working under macOS's stock bash (3.2, no arrays): e2e/install_test.sh
  # exercises it end to end. Also runs the unit suite on sqlite, the backend the e2e script uses
  # nowhere but that is otherwise only covered on Linux above.
  macos:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.lane != 'fast' }}
    runs-on: macos-latest
    env:
      RUN: ${{ needs.changes.outputs.code != 'false' }}
    steps:
      - uses: actions/checkout@v4
        if: env.RUN == 'true'
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-python@v5
        if: env.RUN == 'true'
        with:
          python-version: "3.11"
          cache: pip

      - name: Syntax-check install.sh under bash 3.2
        if: env.RUN == 'true'
        run: bash -n install.sh

      - name: Build the checkout's own venv (e2e/install_test.sh expects $ROOT/.venv already built)
        if: env.RUN == 'true'
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -q -r requirements.txt -r requirements-postgres.txt

      - name: install.sh end to end (bash 3.2)
        if: env.RUN == 'true'
        run: |
          set -o pipefail
          bash e2e/install_test.sh 2>&1 | tee e2e.log || { python3 .github/scripts/annotate.py e2e.log; exit 1; }

      - name: Unit suite (backend=sqlite)
        if: env.RUN == 'true'
        env:
          SWARM_TEST_BACKEND: sqlite
        run: |
          set -o pipefail
          .venv/bin/python -B .github/scripts/run_tests.py </dev/null 2>&1 | tee test.log || { python3 .github/scripts/annotate.py test.log; exit 1; }

  # The Postgres-backed classes (tests/support.py PostgresHarness, tests/test_stall.py's Postgres
  # proxy tests) are skipped everywhere else because they need SWARM_TEST_CONFIG. Give them a
  # real, throwaway database here (run_tests.py gives each parallel slot a database of its own).
  # Release lane only. Two jobs in parallel: `postgres` (the whole suite, minus the known-stall
  # recovery tests) and `postgres-drive` (the drive suites on a Postgres board, then the
  # known-stall tests, allowed to fail).
  postgres:
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    env:
      RUN: ${{ needs.changes.outputs.code != 'false' && needs.changes.outputs.lane != 'fast' }}
    services:
      postgres:
        # Empty image (nothing to run) = no service container.
        image: ${{ needs.changes.outputs.code != 'false' && needs.changes.outputs.lane != 'fast' && 'public.ecr.aws/docker/library/postgres:16' || '' }}
        env:
          POSTGRES_USER: swarm_test
          POSTGRES_PASSWORD: swarm_test_pw
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U swarm_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        if: env.RUN == 'true'
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-python@v5
        if: env.RUN == 'true'
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        if: env.RUN == 'true'
        run: pip install -r requirements.txt -r requirements-postgres.txt

      - name: Write a throwaway SWARM_TEST_CONFIG
        if: env.RUN == 'true'
        run: .github/scripts/pg_test_config.sh

      - name: Postgres suite (excluding the known-stall recovery tests)
        if: env.RUN == 'true'
        run: |
          set -o pipefail
          python -B .github/scripts/run_tests.py --skip-class PostgresFollowRecoveryTests </dev/null 2>&1 | tee pg.log || { python .github/scripts/annotate.py pg.log; exit 1; }

  postgres-drive:
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    env:
      RUN: ${{ needs.changes.outputs.code != 'false' && needs.changes.outputs.lane != 'fast' }}
    services:
      postgres:
        image: ${{ needs.changes.outputs.code != 'false' && needs.changes.outputs.lane != 'fast' && 'public.ecr.aws/docker/library/postgres:16' || '' }}
        env:
          POSTGRES_USER: swarm_test
          POSTGRES_PASSWORD: swarm_test_pw
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U swarm_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        if: env.RUN == 'true'
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-python@v5
        if: env.RUN == 'true'
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        if: env.RUN == 'true'
        run: pip install -r requirements.txt -r requirements-postgres.txt

      - name: Write a throwaway SWARM_TEST_CONFIG
        if: env.RUN == 'true'
        run: .github/scripts/pg_test_config.sh

      # The drive suites (tests/test_drive_*.py) again, on the Postgres board: modules with
      # backend variants (support.add_backend_variants) run their Postgres classes, the CLI ones
      # (activate, hooks) run wholly on a Postgres board through SWARM_TEST_BACKEND. The summary
      # fails the step when a module ran nothing, a Postgres variant never ran, or a test skipped.
      - name: Drive suites on Postgres
        if: env.RUN == 'true'
        env:
          SWARM_TEST_BACKEND: postgres
        run: |
          set -o pipefail
          python -B .github/scripts/run_tests.py --verbose --log drive-pg.log $(cd tests && ls test_drive_*.py | sed 's/\.py$//') </dev/null 2>&1 | tee drive-run.log || { python .github/scripts/annotate.py drive-run.log; exit 1; }
          python .github/scripts/drive_pg_summary.py drive-pg.log

      - name: Known-stall recovery tests (swarm tail/watch vs a stalling proxy; allowed to fail)
        if: ${{ !cancelled() && env.RUN == 'true' }}
        continue-on-error: true
        timeout-minutes: 5
        run: cd tests && python -B -m unittest test_stall.PostgresFollowRecoveryTests -v </dev/null

  complexity-analyzer:
    needs: changes
    if: ${{ !cancelled() }}
    defaults:
      run:
        shell: bash
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((github.event_name == 'workflow_call' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/int/rc' || startsWith(github.ref, 'refs/tags/v'))) || (github.event_name == 'pull_request' && github.base_ref == 'main')) && '["ubuntu-latest","windows-latest","macos-latest"]' || '["ubuntu-latest"]') }}
    env:
      RUN: ${{ needs.changes.outputs.code != 'false' && needs.changes.outputs.complexity != 'false' }}
    steps:
      - uses: actions/checkout@v4
        if: env.RUN == 'true'
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-python@v5
        if: env.RUN == 'true'
        with:
          python-version: "3.11"
      - name: Install skill test dependencies
        if: env.RUN == 'true'
        run: python -m pip install pytest tree-sitter==0.26.0 tree-sitter-rust==0.24.2 radon==6.0.1 vulture==2.16
      - name: Skill tests (downloaded tools optional; no tool downloads)
        if: env.RUN == 'true'
        run: |
          set -o pipefail
          python -B -m pytest -q -p no:cacheprovider skills/complexity-analyzer/tests --ignore=skills/complexity-analyzer/tests/fixtures 2>&1 | tee skill-test.log || { python .github/scripts/annotate.py skill-test.log; exit 1; }

  install-checks:
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    env:
      RUN: ${{ needs.changes.outputs.code != 'false' && needs.changes.outputs.install != 'false' }}
    steps:
      - uses: actions/checkout@v4
        if: ${{ env.RUN == 'true' }}
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-python@v5
        if: ${{ env.RUN == 'true' }}
        with:
          python-version: "3.13"

      - name: bash -n install.sh
        if: ${{ env.RUN == 'true' }}
        run: bash -n install.sh

      - name: shellcheck install.sh (severity=error, non-blocking)
        if: ${{ env.RUN == 'true' }}
        continue-on-error: true
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          fi
          shellcheck --severity=error install.sh

      - name: Try installing the Claude Code CLI
        if: ${{ env.RUN == 'true' }}
        id: claude_cli
        continue-on-error: true
        run: npm install -g @anthropic-ai/claude-code && claude --version

      - name: claude plugin validate .
        if: ${{ env.RUN == 'true' && steps.claude_cli.outcome == 'success' }}
        run: claude plugin validate .

      - name: Validate plugin manifests' JSON structure (claude CLI unavailable)
        if: ${{ env.RUN == 'true' && steps.claude_cli.outcome != 'success' }}
        run: |
          python3 - <<'PY'
          import json, sys
          from pathlib import Path

          checks = [
              ".claude-plugin/plugin.json",
              ".claude-plugin/marketplace.json",
              ".codex-plugin/plugin.json",
          ]
          ok = True
          for rel in checks:
              p = Path(rel)
              try:
                  data = json.loads(p.read_text())
              except Exception as exc:  # noqa: BLE001
                  print(f"INVALID JSON: {rel}: {exc}")
                  ok = False
                  continue
              if "name" not in data:
                  print(f"MISSING 'name': {rel}")
                  ok = False
              print(f"ok: {rel}")
          sys.exit(0 if ok else 1)
          PY
