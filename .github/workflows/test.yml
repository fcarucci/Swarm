name: Test
on:
  push:
    branches: ["perf/frink"]
  workflow_dispatch:
jobs:
  timing:
    runs-on: ${{ matrix.os }}
    defaults: {run: {shell: bash}}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, backend: sqlite}
          - {os: ubuntu-latest, backend: memory}
          - {os: windows-latest, backend: sqlite}
          - {os: windows-latest, backend: memory}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13", cache: pip}
      - run: pip install -r requirements.txt -r requirements-postgres.txt
      - name: timed suite
        env: {SWARM_TEST_BACKEND: "${{ matrix.backend }}", PYTHONUTF8: "1"}
        run: python -B tests/_frink_timing.py "$GITHUB_WORKSPACE/t-${{ matrix.os }}-${{ matrix.backend }}.csv" </dev/null 2>&1 | tail -30
      - uses: actions/upload-artifact@v4
        with: {name: "t-${{ matrix.os }}-${{ matrix.backend }}", path: "t-*.csv"}
