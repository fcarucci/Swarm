name: Test

on:
  push:
    branches-ignore:
      - "release/**"
  pull_request:
  workflow_dispatch:
    inputs:
      ref:
        description: "Ref to test (default: the branch this was run from)"
        required: false
  workflow_call:
    inputs:
      ref:
        description: "Ref to test (default: the ref that triggered the caller)"
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# CI is the bottleneck while many feat/drive-* seat branches push at once: those branches run a
# REDUCED matrix (ubuntu, Python 3.13, memory + sqlite, and the real-Postgres job). The full matrix
# (every backend and Python, Windows, macOS, the complexity-analyzer skill, the install checks)
# runs on everything else: feat/swarm-autonomy, preview/*, main, pull requests and dispatches.
# A newer push to the same ref cancels the older run (concurrency above).
jobs:
  # Backend contract + hook/CLI suite, on every offline backend and both the minimum and the
  # latest supported Python (README "Requirements": 3.11 or newer).
  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        backend: ${{ fromJSON(startsWith(github.ref, 'refs/heads/feat/drive-') && '["memory","sqlite"]' || '["memory","sqlite","file"]') }}
        python-version: ${{ fromJSON(startsWith(github.ref, 'refs/heads/feat/drive-') && '["3.13"]' || '["3.11","3.13"]') }}
        # The oldest supported Python on the memory backend always runs (on the full matrix this entry is
        # already one of its cells): 3.11-only breakages (argparse, f-string quoting) must fail seat CI too.
        include:
          - backend: memory
            python-version: "3.11"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-postgres.txt

      - name: Run tests (backend=${{ matrix.backend }})
        env:
          SWARM_TEST_BACKEND: ${{ matrix.backend }}
        run: |
          set -o pipefail
          python -B -m unittest discover -s tests -q 2>&1 | tee test.log || { python .github/scripts/annotate.py test.log; exit 1; }

  # Native Windows: the unit suite on the offline backends. POSIX-only tests carry skip markers
  # with a reason; nothing is skipped on Linux.
  windows:
    if: ${{ !startsWith(github.ref, 'refs/heads/feat/drive-') }}
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        backend: [memory, sqlite, file]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-postgres.txt

      - name: Run tests (backend=${{ matrix.backend }})
        env:
          SWARM_TEST_BACKEND: ${{ matrix.backend }}
          PYTHONUTF8: "1"
        run: |
          set -o pipefail
          python -B -m unittest discover -s tests -q 2>&1 | tee test.log || { python .github/scripts/annotate.py test.log; exit 1; }

  # install.sh must keep working under macOS's stock bash (3.2, no arrays): e2e/install_test.sh
  # exercises it end to end. Also runs the unit suite on sqlite, the backend the e2e script uses
  # nowhere but that is otherwise only covered on Linux above.
  macos:
    if: ${{ !startsWith(github.ref, 'refs/heads/feat/drive-') }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Syntax-check install.sh under bash 3.2
        run: bash -n install.sh

      - name: Build the checkout's own venv (e2e/install_test.sh expects $ROOT/.venv already built)
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -q -r requirements.txt -r requirements-postgres.txt

      - name: install.sh end to end (bash 3.2)
        run: |
          set -o pipefail
          bash e2e/install_test.sh 2>&1 | tee e2e.log || { python3 .github/scripts/annotate.py e2e.log; exit 1; }

      - name: Unit suite (backend=sqlite)
        env:
          SWARM_TEST_BACKEND: sqlite
        run: |
          set -o pipefail
          .venv/bin/python -B -m unittest discover -s tests -q 2>&1 | tee test.log || { python3 .github/scripts/annotate.py test.log; exit 1; }

  # The Postgres-backed classes (tests/support.py PostgresHarness, tests/test_stall.py's Postgres
  # proxy tests) are skipped everywhere else because they need SWARM_TEST_CONFIG. Give them a
  # real, throwaway database here. PostgresFollowRecoveryTests drives `swarm tail`/`swarm watch`
  # as real subprocesses through a stalling TCP proxy and is known to hang intermittently in CI
  # environments; it runs separately and is allowed to fail (see the last step).
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:16
        env:
          POSTGRES_USER: swarm_test
          POSTGRES_PASSWORD: swarm_test_pw
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U swarm_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-postgres.txt

      - name: Write a throwaway SWARM_TEST_CONFIG
        run: |
          mkdir -p "$RUNNER_TEMP/swarm-pg"
          printf 'PGPASSWORD=swarm_test_pw\n' > "$RUNNER_TEMP/swarm-pg/pg.env"
          chmod 600 "$RUNNER_TEMP/swarm-pg/pg.env"
          # dbname deliberately not the default "swarm_board": PostgresHarness refuses to run
          # against the database of the live config (tests/support.py), so a throwaway database
          # can never collide with a real board. admin_dbname is postgres (POSTGRES_DB above); the CI role is
          # the cluster's initdb superuser, which has CREATEDB.
          cat > "$RUNNER_TEMP/swarm-pg/test-config.toml" <<EOF
          [database]
          host = "127.0.0.1"
          port = 5432
          user = "swarm_test"
          dbname = "swarm_ci_test"
          admin_dbname = "postgres"
          password_env_file = "$RUNNER_TEMP/swarm-pg/pg.env"
          connect_timeout = 5
          sslmode = "prefer"
          query_timeout_seconds = 8
          prepared_statements = false

          [board]
          backend = "postgres"
          EOF
          echo "SWARM_TEST_CONFIG=$RUNNER_TEMP/swarm-pg/test-config.toml" >> "$GITHUB_ENV"

      - name: Postgres suite (excluding the known-stall recovery tests)
        run: |
          set -o pipefail
          cd tests
          python -B run_postgres_suite.py 2>&1 | tee ../pg.log || { cd .. && python .github/scripts/annotate.py pg.log; exit 1; }

      # The drive suites (tests/test_drive_*.py) again, on the Postgres board: modules with
      # backend variants (support.add_backend_variants) run their Postgres classes, the CLI ones
      # (activate, hooks) run wholly on a Postgres board through SWARM_TEST_BACKEND. The summary
      # fails the step when a module ran nothing, a Postgres variant never ran, or a test skipped.
      - name: Drive suites on Postgres
        if: ${{ !cancelled() }}   # its own signal, whatever the whole-suite step said
        env:
          SWARM_TEST_BACKEND: postgres
        run: |
          set -o pipefail
          cd tests
          python -B -m unittest -v $(ls test_drive_*.py | sed 's/\.py$//') 2>&1 | tee ../drive-pg.log || { cd .. && python .github/scripts/annotate.py drive-pg.log; exit 1; }
          cd .. && python .github/scripts/drive_pg_summary.py drive-pg.log

      - name: Known-stall recovery tests (swarm tail/watch vs a stalling proxy; allowed to fail)
        continue-on-error: true
        run: cd tests && python -B -m unittest test_stall.PostgresFollowRecoveryTests -v

  complexity-analyzer:
    if: ${{ !startsWith(github.ref, 'refs/heads/feat/drive-') }}
    defaults:
      run:
        shell: bash
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install skill test dependencies
        run: python -m pip install pytest tree-sitter==0.26.0 tree-sitter-rust==0.24.2 radon==6.0.1 vulture==2.16
      - name: Skill tests (downloaded tools optional; no tool downloads)
        run: |
          set -o pipefail
          python -B -m pytest -q -p no:cacheprovider skills/complexity-analyzer/tests --ignore=skills/complexity-analyzer/tests/fixtures 2>&1 | tee skill-test.log || { python .github/scripts/annotate.py skill-test.log; exit 1; }

  install-checks:
    if: ${{ !startsWith(github.ref, 'refs/heads/feat/drive-') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: bash -n install.sh
        run: bash -n install.sh

      - name: shellcheck install.sh (severity=error, non-blocking)
        continue-on-error: true
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          fi
          shellcheck --severity=error install.sh

      - name: Try installing the Claude Code CLI
        id: claude_cli
        continue-on-error: true
        run: npm install -g @anthropic-ai/claude-code && claude --version

      - name: claude plugin validate .
        if: steps.claude_cli.outcome == 'success'
        run: claude plugin validate .

      - name: Validate plugin manifests' JSON structure (claude CLI unavailable)
        if: steps.claude_cli.outcome != 'success'
        run: |
          python3 - <<'PY'
          import json, sys
          from pathlib import Path

          checks = [
              ".claude-plugin/plugin.json",
              ".claude-plugin/marketplace.json",
              ".codex-plugin/plugin.json",
          ]
          ok = True
          for rel in checks:
              p = Path(rel)
              try:
                  data = json.loads(p.read_text())
              except Exception as exc:  # noqa: BLE001
                  print(f"INVALID JSON: {rel}: {exc}")
                  ok = False
                  continue
              if "name" not in data:
                  print(f"MISSING 'name': {rel}")
                  ok = False
              print(f"ok: {rel}")
          sys.exit(0 if ok else 1)
          PY
