name: Test
on:
  push:
    branches: ["perf/frink"]
  workflow_dispatch:
jobs:
  linux-instrumented:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13", cache: pip}
      - run: pip install -r requirements.txt -r requirements-postgres.txt
      - name: timed suite with popen and sleep counters
        env: {SWARM_TEST_BACKEND: sqlite}
        run: python -B tests/_frink_timing.py "$GITHUB_WORKSPACE/t-linux-inst.csv" </dev/null 2>&1 | tail -5
      - uses: actions/upload-artifact@v4
        with: {name: t-linux-inst, path: "t-*.csv"}
