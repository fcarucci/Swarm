name: Perf (lead measurements)
on:
  push:
    branches: [perf/lead]
defaults:
  run:
    shell: bash
jobs:
  pool:
    if: ${{ contains(github.event.head_commit.message, '[pool]') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: j4-split, jobs: 4, dur: 0, idle: "60", excl: ""}
          - {name: j4-split-lpt, jobs: 4, dur: 1, idle: "60", excl: ""}
          - {name: fast-j4, jobs: 4, dur: 1, idle: "5", excl: "test_install_sh,test_update_sh,test_codex_directory,test_drive_session_driver.IdleOrchestratorEndToEnd"}
          - {name: fast-j6, jobs: 6, dur: 1, idle: "5", excl: "test_install_sh,test_update_sh,test_codex_directory,test_drive_session_driver.IdleOrchestratorEndToEnd"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13", cache: pip}
      - run: pip install -r requirements.txt -r requirements-postgres.txt
      - name: pool ${{ matrix.name }}
        env:
          SWARM_TEST_BACKEND: memory
          SWARM_DRIVER_IDLE_SECONDS: ${{ matrix.idle }}
        run: |
          d=""; [ "${{ matrix.dur }}" = 1 ] && d="--durations .github/scripts/durations.json"
          s=$(date +%s)
          python .github/scripts/shard.py --jobs ${{ matrix.jobs }} --flags=-B $d --split test_drive_session_driver,test_drive_land,test_install_sh,test_codex_directory,test_hindsight,test_board_contract --exclude "${{ matrix.excl }}" --out res-${{ matrix.name }}.json
          echo "POOL_WALL=$(( $(date +%s) - s ))s"
      - if: always()
        uses: actions/upload-artifact@v4
        with: {name: "res-${{ matrix.name }}", path: "res-*.json"}
  pg:
    if: ${{ contains(github.event.head_commit.message, '[pg]') }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:16
        env: {POSTGRES_USER: swarm_test, POSTGRES_PASSWORD: swarm_test_pw, POSTGRES_DB: postgres}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U swarm_test" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13", cache: pip}
      - run: pip install -r requirements.txt -r requirements-postgres.txt
      - name: config
        run: |
          mkdir -p "$RUNNER_TEMP/swarm-pg"
          printf 'PGPASSWORD=swarm_test_pw\n' > "$RUNNER_TEMP/swarm-pg/pg.env"; chmod 600 "$RUNNER_TEMP/swarm-pg/pg.env"
          cat > "$RUNNER_TEMP/swarm-pg/test-config.toml" <<EOF
          [database]
          host = "127.0.0.1"
          port = 5432
          user = "swarm_test"
          dbname = "swarm_ci_test"
          admin_dbname = "postgres"
          password_env_file = "$RUNNER_TEMP/swarm-pg/pg.env"
          connect_timeout = 5
          sslmode = "prefer"
          query_timeout_seconds = 8
          prepared_statements = false

          [board]
          backend = "postgres"
          EOF
          echo "SWARM_TEST_CONFIG=$RUNNER_TEMP/swarm-pg/test-config.toml" >> "$GITHUB_ENV"
      - name: pg suite pooled j4
        run: |
          s=$(date +%s)
          python .github/scripts/shard.py --jobs 4 --flags=-B --durations .github/scripts/durations.json --split test_drive_session_driver,test_stall,test_board_contract --exclude test_stall.PostgresFollowRecoveryTests --out res-pg.json || true
          echo "PG_POOL_WALL=$(( $(date +%s) - s ))s"
      - name: drive suites on pg pooled j4
        if: ${{ !cancelled() }}
        env: {SWARM_TEST_BACKEND: postgres}
        run: |
          s=$(date +%s)
          python .github/scripts/shard.py --jobs 4 --flags=-B --only "$(cd tests && ls test_drive_*.py | sed 's/\.py$//' | paste -sd,)" --split test_drive_session_driver --out res-drive-pg.json || true
          echo "DRIVE_PG_POOL_WALL=$(( $(date +%s) - s ))s"
      - if: always()
        uses: actions/upload-artifact@v4
        with: {name: res-pg, path: "res-*.json"}
