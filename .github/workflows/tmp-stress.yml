name: tmp-stress
on:
  workflow_dispatch:
  push:
    branches: [ci-flaky-fix]
    paths: [".github/workflows/tmp-stress.yml", "tmpdiag/**"]
jobs:
  stress:
    runs-on: windows-latest
    defaults: {run: {shell: bash}}
    strategy:
      fail-fast: false
      matrix:
        backend: [file, sqlite, memory]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13", cache: pip}
      - run: pip install -r requirements.txt
      - name: loop change-detection tests
        env: {SWARM_TEST_BACKEND: "${{ matrix.backend }}", PYTHONUTF8: "1"}
        run: python tmpdiag/loop.py 250
