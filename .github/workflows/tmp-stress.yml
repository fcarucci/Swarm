name: tmp-stress
on:
  workflow_dispatch:
  push:
    branches: [ci-flaky-fix]
    paths: [".github/workflows/tmp-stress.yml", "tmpdiag/**"]
jobs:
  stress:
    runs-on: windows-latest
    defaults: {run: {shell: bash}}
    strategy:
      fail-fast: false
      matrix:
        backend: [file, sqlite, memory]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13", cache: pip}
      - run: pip install -r requirements.txt
      - name: signature sequence per post
        env: {SWARM_TEST_BACKEND: "${{ matrix.backend }}", PYTHONUTF8: "1"}
        run: python tmpdiag/sigseq.py 300
      - name: loop change-detection tests
        env: {SWARM_TEST_BACKEND: "${{ matrix.backend }}", PYTHONUTF8: "1"}
        run: python tmpdiag/loop.py 250
      - name: loop whole test_file_board
        env: {SWARM_TEST_BACKEND: "${{ matrix.backend }}", PYTHONUTF8: "1"}
        run: for i in 1 2 3 4 5 6 7 8; do python -B -m unittest -q test_file_board 2>&1 | tail -3 || true; done
        working-directory: tests
